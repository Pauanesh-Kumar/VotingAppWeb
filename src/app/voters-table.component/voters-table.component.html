<table class="table table-bordered table-hover">
  <thead class="table-light">
    <tr>
      <th colspan="2">Voters <button class="btn btn-sm btn-outline-primary ms-2">+</button></th>
    </tr>
    <tr>
      <th>Name</th>
      <th>Has Voted</th>
    </tr>
  </thead>
  <tbody>
    <!-- Voters List -->
    @for (voter of voters(); track voter.id) {
      <tr>
        <td>{{ voter.name }}</td>
        <td class="text-center">{{ voter.hasVoted ? '✓' : '✗' }}</td>
      </tr>
    } @empty {
      <tr>
        <td colspan="2" class="text-center text-muted">No voters available</td>
      </tr>
    }

    <!-- Loading State -->
    @if (loading()) {
      <tr>
        <td colspan="2" class="text-center">Loading voters...</td>
      </tr>
    }

    <!-- Error State (only when not loading) -->
    @if (error() && !loading()) {
      <tr>
        <td colspan="2" class="text-center text-danger">{{ error() }}</td>
      </tr>
    }
  </tbody>
</table>
